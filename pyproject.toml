[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphql-layer"
version = "0.1.0"
description = "Database-agnostic GraphQL facade for the GraphDB Sample Wines knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "strawberry-graphql[fastapi]>=0.270,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.setuptools]
packages = ["api", "domain", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
