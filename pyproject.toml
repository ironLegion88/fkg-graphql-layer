[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphql-layer"
version = "0.1.0"
description = "Database-agnostic GraphQL facade for the GraphDB Sample Wines knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pyoxigraph>=0.5.9,<0.6",
    "pyyaml>=6.0,<7.0",
    "strawberry-graphql[fastapi]>=0.270,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.0,<7.0",
]

[tool.setuptools]
packages = [
    "adapters",
    "adapters.oxigraph",
    "api",
    "domain",
    "ingestion",
    "services",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
